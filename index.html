<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Archive</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-main: #111111;
            --text-muted: #555555;
            --circle-color: #ffffff;
            --accent-gray: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 40px 5vw;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Cabeçalho e Navegação */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border: 4px solid var(--text-main);
            border-radius: 50% 50% 50% 0; /* Formato estilizado do logo */
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
        }

        nav a.active::after {
            content: "•";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
        }

        /* Seção Principal (Hero) */
        main {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        /* Coluna da Esquerda: Texto */
        .text-content {
            max-width: 450px;
            z-index: 3;
        }

        h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        /* Botão com círculo cinza ao fundo */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.9rem;
            position: relative;
            padding-left: 10px;
        }

        .cta-btn::before {
            content: "";
            position: absolute;
            left: -10px;
            width: 45px;
            height: 45px;
            background-color: var(--accent-gray);
            border-radius: 50%;
            z-index: -1;
            transition: transform 0.3s ease;
        }

        .cta-btn:hover::before {
            transform: scale(1.1);
        }

        .arrow {
            margin-left: 15px;
            font-weight: 300;
        }

        /* Links do Rodapé Esquerdo */
        .bottom-links {
            position: absolute;
            bottom: 40px;
            left: 5vw;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 10;
        }

        .bottom-links a {
            color: var(--text-main);
            text-decoration: none;
            border-bottom: 1px solid var(--text-muted);
            padding-bottom: 2px;
            margin: 0 5px;
        }

        .bottom-links a:first-child { margin-left: 0; }
        .bottom-links span { color: var(--text-muted); }

        /* Coluna da Direita: Composição Visual (X e Círculo) */
        .visual-content {
            position: absolute;
            right: 5vw;
            top: 50%;
            transform: translateY(-50%);
            width: 400px; /* Reduzido de 600px */
            height: 400px; /* Reduzido de 600px */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            pointer-events: none; /* Evita que o elemento bloqueie cliques */
        }

        .white-circle {
            position: absolute;
            width: 350px; /* Reduzido de 500px */
            height: 350px; /* Reduzido de 500px */
            background-color: var(--circle-color);
            border-radius: 50%;
            z-index: 1;
        }

        .big-x {
            position: absolute;
            font-size: 20rem; /* Reduzido de 40rem */
            font-weight: 900;
            line-height: 1;
            color: var(--text-main);
            font-family: Arial, sans-serif;
            z-index: 2;
        }

        /* Scroll Down (Direita) */
        .scroll-down {
            position: absolute;
            bottom: 40px;
            right: 5vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .scroll-down span {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.7rem;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-main);
        }

        .scroll-line {
            width: 1px;
            height: 50px;
            background-color: var(--text-main);
            position: relative;
        }

        .scroll-line::after {
            content: "↓";
            position: absolute;
            bottom: -15px;
            left: -4px;
            font-size: 0.8rem;
        }

        /* Responsividade para telas menores */
        @media (max-width: 992px) {
            .container {
                padding: 20px 5vw;
            }
            header {
                flex-direction: column; /* Coloca o logo e o menu em coluna */
                gap: 20px;
            }
            nav {
                display: flex;
                gap: 1.5rem;
                justify-content: center;
            }
            main {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                margin-top: 40px;
            }
            .text-content {
                margin-bottom: 40px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .visual-content {
                position: relative;
                right: 0;
                transform: none;
                width: 100%;
                height: 300px;
            }
            .white-circle { width: 280px; height: 280px; }
            .big-x { font-size: 18rem; }
            
            /* Exibe e reposiciona os links do rodapé */
            .bottom-links {
                position: relative;
                bottom: 0;
                left: 0;
                display: flex;
                justify-content: center;
                margin-top: 30px;
                width: 100%;
            }
            .scroll-down { 
                display: none; /* Mantive oculto pois o scroll vertical em mobile já é intuitivo */
            }
        }

        /* REMOÇÃO DO X EM DISPOSITIVOS MENORES */
        @media (max-width: 768px) {
            .visual-content {
                display: none; /* Remove completamente o X e o círculo em celulares/mobile */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <main>
            <div class="text-content">
                <h1>personal<br>archive.</h1>
                <p>A minimalist repository for my personal links, notes, and resources. Currently sharing my reading schedules.</p>
                
                <a href="archive/index.html" class="cta-btn">
                    ARCHIVES <span class="arrow">&rarr;</span>
                </a>
            </div>

            <div class="visual-content">
                <div class="white-circle"></div>
                <div class="big-x">X</div>
            </div>
        </main>

        <div class="bottom-links">
            <a href="#">Links</a> <span>/</span> 
            <a href="#">Resources</a>
        </div>

        <div class="scroll-down">
            <span>SCROLL DOWN</span>
            <div class="scroll-line"></div>
        </div>
    </div>

</body>
</html>
